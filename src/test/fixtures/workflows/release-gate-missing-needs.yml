name: Missing validation need
on: push
jobs:
  validation:
    uses: ./.github/workflows/release-validation.yml
  release:
    if: needs.validation.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      - name: Publish to JetBrains Marketplace
        if: steps.release-mode.outputs.publish == 'true'
        run: ./gradlew publishPlugin
