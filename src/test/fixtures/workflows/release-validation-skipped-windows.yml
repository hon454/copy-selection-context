name: Skipped Windows validation
on: push
jobs:
  os-tests:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - if: matrix.os == 'ubuntu-latest'
        run: ./gradlew allTests
      - if: matrix.os == 'macos-latest'
        run: ./gradlew allTests
      - if: matrix.os == 'macos-latest'
        run: .\gradlew.bat allTests
