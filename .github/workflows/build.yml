name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Run test suite
        run: ./gradlew test --stacktrace --console=plain

      - name: Verify plugin project and structure
        run: >-
          ./gradlew
          verifyPluginProjectConfiguration
          verifyPluginStructure
          --stacktrace
          --console=plain

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --stacktrace --console=plain

      - name: Build plugin
        run: ./gradlew buildPlugin --stacktrace --console=plain

      - name: Verify plugin ZIP exists
        run: |
          if [ ! -d "build/distributions" ] || [ -z "$(find build/distributions/ -name '*.zip' 2>/dev/null)" ]; then
            echo "::error::No plugin ZIP found in build/distributions/"
            exit 1
          fi
          echo "Plugin ZIP found:"
          ls -la build/distributions/*.zip

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/pluginVerifier/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-artifact
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30
