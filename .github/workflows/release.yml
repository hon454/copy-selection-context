name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=v$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify version matches build.gradle.kts
        run: bash scripts/verify-release-version.sh "${{ steps.version.outputs.tag }}"

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Generate release notes from changelog
        run: |
          bash scripts/generate-release-notes.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.tag }}"

      - name: Run Kotlin static analysis
        run: ./gradlew detekt --stacktrace --console=plain

      - name: Run test suite and generate Kotlin coverage
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew
          allTests
          koverXmlReport
          koverHtmlReport
          --continue
          --stacktrace
          --console=plain

      - name: Verify plugin project and structure
        run: >-
          ./gradlew
          verifyPluginProjectConfiguration
          verifyPluginStructure
          --stacktrace
          --console=plain

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --stacktrace --console=plain

      - name: Build plugin
        run: ./gradlew buildPlugin --stacktrace --console=plain

      - name: Resolve release mode
        id: release-mode
        run: bash scripts/resolve-release-mode.sh "$GITHUB_OUTPUT"

      - name: Sign and verify canonical release ZIP
        if: steps.release-mode.outputs.signed == 'true'
        run: |
          signing_certificate_file="$RUNNER_TEMP/copy-selection-context-signing-chain.crt"
          trap 'rm -f "$signing_certificate_file"' EXIT
          printf '%s' "$CERTIFICATE_CHAIN" > "$signing_certificate_file"
          chmod 600 "$signing_certificate_file"
          env -u CERTIFICATE_CHAIN CERTIFICATE_CHAIN_FILE="$signing_certificate_file" \
            ./gradlew signPlugin --stacktrace --console=plain
          env -u CERTIFICATE_CHAIN CERTIFICATE_CHAIN_FILE="$signing_certificate_file" \
            ./gradlew verifyPluginSignature --stacktrace --console=plain

      - name: Select canonical release ZIP
        id: release-artifact
        run: >-
          bash scripts/select-release-artifact.sh
          build/distributions
          "${{ steps.release-mode.outputs.signed }}"
          "$GITHUB_OUTPUT"

      - name: Generate and verify release checksum
        run: >-
          bash scripts/generate-release-checksum.sh
          "${{ steps.release-artifact.outputs.path }}"
          SHA256SUMS

      - name: Generate release ZIP attestation
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release-artifact.outputs.path }}

      - name: Verify release ZIP attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          "${{ steps.release-artifact.outputs.path }}"
          --bundle "${{ steps.attestation.outputs.bundle-path }}"
          --repo "${{ github.repository }}"
          --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
          --source-digest "${{ github.sha }}"
          --source-ref "${{ github.ref }}"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/tests/platformTest/
            build/test-results/platformTest/
            build/reports/detekt/
            build/reports/kover/
            build/reports/pluginVerifier/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            ${{ steps.release-artifact.outputs.path }}
            SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Publish to JetBrains Marketplace
        if: steps.release-mode.outputs.publish == 'true'
        run: >-
          ./gradlew publishPlugin
          -PcanonicalPluginArchive="${{ steps.release-artifact.outputs.path }}"
          --stacktrace
          --console=plain
