name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=v$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify version matches build.gradle.kts
        run: bash scripts/verify-release-version.sh "${{ steps.version.outputs.tag }}"

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Generate release notes from changelog
        run: |
          bash scripts/generate-release-notes.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.tag }}"

      - name: Run test suite
        run: ./gradlew test --stacktrace --console=plain

      - name: Verify plugin project and structure
        run: >-
          ./gradlew
          verifyPluginProjectConfiguration
          verifyPluginStructure
          --stacktrace
          --console=plain

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --stacktrace --console=plain

      - name: Build plugin
        run: ./gradlew buildPlugin --stacktrace --console=plain

      - name: Verify plugin ZIP exists
        run: |
          if [ ! -d "build/distributions" ] || [ -z "$(find build/distributions/ -name '*.zip' 2>/dev/null)" ]; then
            echo "::error::No plugin ZIP found in build/distributions/"
            exit 1
          fi
          echo "Plugin ZIP found:"
          ls -la build/distributions/*.zip

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/pluginVerifier/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: build/distributions/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Publish to JetBrains Marketplace
        if: >-
          env.PUBLISH_TOKEN != '' &&
          env.CERTIFICATE_CHAIN != '' &&
          env.PRIVATE_KEY != ''
        run: ./gradlew publishPlugin
