name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=v$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify version matches build.gradle.kts
        run: bash scripts/verify-release-version.sh "${{ steps.version.outputs.tag }}"

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Generate release notes from changelog
        run: |
          bash scripts/generate-release-notes.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.tag }}"

      - name: Run test suite
        run: ./gradlew test --stacktrace --console=plain

      - name: Verify plugin project and structure
        run: >-
          ./gradlew
          verifyPluginProjectConfiguration
          verifyPluginStructure
          --stacktrace
          --console=plain

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --stacktrace --console=plain

      - name: Build plugin
        run: ./gradlew buildPlugin --stacktrace --console=plain

      - name: Verify plugin ZIP exists
        id: release-artifact
        run: |
          mapfile -t plugin_zips < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print)
          if [ "${#plugin_zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one plugin ZIP in build/distributions/, found ${#plugin_zips[@]}"
            exit 1
          fi
          echo "path=${plugin_zips[0]}" >> "$GITHUB_OUTPUT"
          echo "Plugin ZIP found: ${plugin_zips[0]}"

      - name: Generate and verify release checksum
        run: >-
          bash scripts/generate-release-checksum.sh
          "${{ steps.release-artifact.outputs.path }}"
          SHA256SUMS

      - name: Generate release ZIP attestation
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release-artifact.outputs.path }}

      - name: Verify release ZIP attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          "${{ steps.release-artifact.outputs.path }}"
          --bundle "${{ steps.attestation.outputs.bundle-path }}"
          --repo "${{ github.repository }}"
          --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
          --source-digest "${{ github.sha }}"
          --source-ref "${{ github.ref }}"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/pluginVerifier/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            ${{ steps.release-artifact.outputs.path }}
            SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Publish to JetBrains Marketplace
        if: >-
          env.PUBLISH_TOKEN != '' &&
          env.CERTIFICATE_CHAIN != '' &&
          env.PRIVATE_KEY != ''
        run: ./gradlew publishPlugin
